<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Games - Zenfeed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .games-grid {
            display: grid;
            gap: 20px;
            margin-top: 30px;
        }

        .game-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border-color: #667eea;
        }

        .game-card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .game-card p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .game-card .features {
            list-style: none;
            margin-top: 15px;
        }

        .game-card .features li {
            padding: 5px 0;
            color: #666;
        }

        .game-card .features li:before {
            content: "✓ ";
            color: #27AE60;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 25px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Web Games Collection</h1>
        <p class="description">基于HTML5和JavaScript的网页游戏合集</p>

        <div class="games-grid">
            <a href="tank-game/" class="game-card">
                <h2>🎮 坦克大战 Tank Battle</h2>
                <p>一个完整的网页版坦克大战游戏，使用HTML5 Canvas和原生JavaScript开发。</p>
                <ul class="features">
                    <li>玩家坦克控制（方向键移动，空格发射）</li>
                    <li>智能敌方AI（自动移动和射击）</li>
                    <li>子弹发射和碰撞检测系统</li>
                    <li>可破坏的墙体和障碍物</li>
                    <li>基地保护目标</li>
                    <li>得分系统和关卡系统</li>
                </ul>
                <span class="btn">开始游戏 Play Now →</span>
            </a>

            <!-- 未来可以添加更多游戏 -->
        </div>
    </div>
</body>
</html>
